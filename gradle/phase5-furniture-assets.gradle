def woodBoard = { List from, List to, String texture, List<String> hidden = [] ->
    Map faces = [:]
    [north: [0, 1], south: [0, 1], east: [2, 1], west: [2, 1], up: [0, 2], down: [0, 2]].each {
        String face, List<Integer> axes ->
            if (!hidden.contains(face)) {
                faces[face] = [uv: [from[axes[0]], from[axes[1]], to[axes[0]], to[axes[1]]],
                        texture: "#${texture}".toString()]
            }
    }
    [from: from, to: to, faces: faces]
}

def bedsideCabinetTemplates = {
    List frame = [
        woodBoard([1,10.5,1], [15,12,15], 'planks'),
        woodBoard([2,2,2], [14,3,14], 'planks'),
        woodBoard([2,3,2], [3,10.5,14], 'planks', ['up','down']),
        woodBoard([13,3,2], [14,10.5,14], 'planks', ['up','down']),
        woodBoard([3,3,2], [13,10.5,3], 'planks', ['west','east','up','down']),
        woodBoard([3,6.25,3], [13,6.75,14], 'planks', ['west','east','north'])
    ]
    [2,12].each { x ->
        [2,12].each { z -> frame.add(woodBoard([x,0,z], [x + 2,2,z + 2], 'log', ['up'])) }
    }
    Closure drawer = { BigDecimal bottom, boolean open ->
        def back = open ? 8.5 : 7
        def front = back + 7
        def top = bottom + 3
        [
            woodBoard([3.125,bottom,back], [12.875,bottom + 0.5,front - 0.75], 'planks', ['south']),
            woodBoard([3.125,bottom + 0.5,back], [3.625,top,front - 0.75], 'planks', ['down','south']),

            woodBoard([3.625,bottom + 0.5,back], [12.375,top,back + 0.5], 'planks', ['west','east','down']),
            woodBoard([3.125,bottom,front - 0.75], [12.875,top,front], 'planks'),
            woodBoard([6.5,bottom + 1,front], [9.5,bottom + 2,front + 0.5], 'log', ['north'])

    Map families = phase5Families()
    Map barrel = new JsonSlurper().parse(new File(phase5Root, 'models/block/template_barrel_wood_ironage.json')) as Map
    barrel.elements = barrel.elements.findAll { !it.name.startsWith('lid_') }
    models['models/block/template_barrel_wood_ironage_open.json'] = barrel
    shelvingUnitTemplates().each { suffix, model ->
        models["models/block/template_shelving_unit_${suffix}.json".toString()] = model
    }
    bedsideCabinetTemplates().each { suffix, model ->
        models["models/block/template_bedside_cabinet_wood_ironage_${suffix}.json".toString()] = model
    }
    crateTemplates().each { suffix, model ->
        models["models/block/template_crate_wood_ironage_${suffix}.json".toString()] = model
    }
    [drawer_unit: 16, half_drawer_unit: 8].each { String family, int depth ->
        drawerTemplates(depth).each { suffix, model ->
            models["models/block/template_${family}_${suffix}.json".toString()] = model
        }
    }
    storageBenchTemplates(families.storage_bench.itemDisplay).each { suffix, model ->
        models["models/block/template_storage_bench_${suffix}.json".toString()] = model
    }
    toolRackTemplates().each { part, model ->
        models["models/block/template_tool_rack_${part}.json".toString()] = model
    }
    models.putAll(shelvingMediaModels())
    models['models/block/template_produce_tray.json'] = produceTrayModel()
    (0..3).each { joins ->
        models["models/block/template_produce_rack_${joins}.json".toString()] = produceRackModel(joins as int)
    }
    phase5Woods().each { String wood ->
        Map chair = new JsonSlurper().parse(new File(phase5Root,
                "models/block/chair_wood_ironage_classic_${wood}.json")) as Map
        Map woodTextures = chair.textures as Map
        if (!woodTextures['0'] || !woodTextures['1']) throw new GradleException("Missing chair wood textures: ${wood}")
        Map produceTextures = [log: woodTextures['0'], planks: woodTextures['1'], particle: woodTextures['1']]
        models["models/block/produce_tray_${wood}.json".toString()] =
            [parent: 'ironagefurniture:block/template_produce_tray', textures: produceTextures]
        (0..3).each { joins ->
            models["models/block/produce_rack_${wood}_${joins}.json".toString()] =
                [parent: "ironagefurniture:block/template_produce_rack_${joins}".toString(), textures: produceTextures]
        }
        [produce_tray: ["produce_tray_${wood}", 0.67, 1.25], produce_rack: ["produce_rack_${wood}_0", 0.38, -3]].each {
            String id, List settings ->
                def size = settings[1]
                models["models/item/${id}_${wood}.json".toString()] = [
                    parent: "ironagefurniture:block/${settings[0]}".toString(),
                    display: [gui: [rotation: [30,225,0], translation: [0,settings[2],0], scale: [size,size,size]],
                              ground: [translation: [0,2,0], scale: [0.35,0.35,0.35]],
                              firstperson_righthand: [rotation: [0,45,0], scale: [0.35,0.35,0.35]],
                              thirdperson_righthand: [translation: [0,2,0], scale: [0.3,0.3,0.3]]]]
        }
        families.each { family, definition ->
            definition.models.each { suffix, source ->
                Map model = new JsonSlurper().parseText(JsonOutput.toJson(source)) as Map
                model.textures.log = woodTextures['0']
                model.textures.planks = woodTextures['1']
                if (model.textures.containsKey('0')) model.textures['0'] = woodTextures['0']
                if (model.textures.containsKey('1')) model.textures['1'] = woodTextures['1']
                model.textures.particle = family.contains('cabinet') ? woodTextures['1'] : woodTextures['0']
                models["models/block/${definition.prefix}${wood}_${suffix}.json".toString()] = model
            }
        }
    }
    [generatedModels: models]
}
def phase5Write = { File target, Object value ->
    target.parentFile.mkdirs()
    target.setText(JsonOutput.prettyPrint(JsonOutput.toJson(value)) + '\n', 'UTF-8')
}
def phase5WoodName = { String value ->
    def bracket = value =~ /\(([^()]*)\)$/
    bracket.find() ? bracket.group(1) : value.replaceFirst(/ Classic Chair$/, '')
}

def shelvingUnitTemplates = {
    Map<String, Map> templates = [:]
    [false, true].each { boolean standing ->
        (0..15).each { int connections ->
            boolean joinedAbove = (connections & 1) != 0
            boolean joinedRight = (connections & 2) != 0
            boolean joinedBelow = (connections & 4) != 0
            boolean joinedLeft = (connections & 8) != 0
            def bottom = joinedBelow ? 0.5 : 1
            def top = joinedAbove ? 15.5 : 15
            def left = joinedLeft ? 0.5 : 1
            def right = joinedRight ? 15.5 : 15
            int front = standing ? 4 : 8
            int back = front + 8
            List<String> seams = []
            if (joinedLeft) seams.add('west')
            if (joinedRight) seams.add('east')

            // Shared shelves sit between continuous uprights, just like the centre shelf.
            def postBottom = joinedBelow ? 0 : bottom
            def postTop = joinedAbove ? 16 : top
            Map bottomBoard = joinedBelow
                ? woodBoard([left, 0, front], [right, bottom, back], 'planks', ['west', 'east', 'down'])
                : woodBoard([0, 0, front], [16, bottom, back], 'log', seams)
            Map topBoard = joinedAbove
                ? woodBoard([left, top, front], [right, 16, back], 'planks', ['west', 'east', 'up'])
                : woodBoard([0, top, front], [16, 16, back], 'log', seams)

            String suffix = standing ? "standing_${connections}" : connections.toString()
            templates[suffix] = [elements: [
                bottomBoard,
                topBoard,
                woodBoard([0, postBottom, front], [left, postTop, back], 'log', joinedLeft ? ['west', 'up', 'down'] : ['up', 'down']),
                woodBoard([right, postBottom, front], [16, postTop, back], 'log', joinedRight ? ['east', 'up', 'down'] : ['up', 'down']),
                woodBoard([left, 7.5, front], [right, 8.5, back], 'planks', ['west', 'east'])
            ]]
        }
    }
    templates
}
def shelvingDiscRow = { List<Map> parts, int count ->
    List<Map> tray = parts.findAll { it.name.startsWith('embedded record rack ') }
    List<Map> disc = parts - tray

    // Widen the tray to a full model block before the renderer scales it to fit between the uprights.
    List<Map> row = tray.collect { Map part ->
        boolean rail = part.name.endsWith('rail')
        def left = rail ? 3.35 : part.from[0]
        def right = rail ? 12.65 : part.to[0]
        part + [
            from: [(left - 2.8) * 16 / 10.4, part.from[1], part.from[2]],
            to: [(right - 2.8) * 16 / 10.4, part.to[1], part.to[2]]
        ]
    }
    // The models face north, so the positive X end is on the viewer's left.
    (0..<count).each { int index ->
        def centre = 14.75 - index * 1.5
        String sleeveTexture = "#record_${index % 6}"
        disc.each { Map part ->
            def halfWidth = (part.to[0] - part.from[0]) / 2
            row.add(part + [
                name: part.name.replaceFirst(/\d+$/, (index + 1).toString()),
                from: [centre - halfWidth, part.from[1], part.from[2]],
                to: [centre + halfWidth, part.to[1], part.to[2]],
                faces: part.faces.collectEntries { face, data ->
                    [(face): data.texture == '#record_0' ? data + [texture: sleeveTexture] : data]
                }
            ])
        }
    }
    row
}
def shelvingMediaModels = {
    Map<String, Map> models = [:]
    Map discSource = new JsonSlurper().parse(new File(phase5Root,
        'models/block/template_shelf_wall_straight_records_1.json')) as Map
    [books: 5, records: 10].each { String kind, int capacity ->
        (1..capacity).each { int count ->
            String name = "${kind}_${count}"
            Map source = kind == 'records' ? discSource : new JsonSlurper().parse(new File(phase5Root,
                "models/block/template_shelf_wall_straight_${name}.json")) as Map
            Map textures = source.textures.findAll { key, value -> value }
            textures.planks = 'minecraft:blocks/planks_oak'
            textures.particle = textures.planks

            List<Map> parts = source.elements.findAll { it.name?.startsWith('embedded ') }
            if (kind == 'records') {
                parts = shelvingDiscRow(parts, count)
            }

            // Centre the arrangement in depth and put its base at shelf height.
            List elements = parts.collect { Map element ->
                element + [
                    from: [element.from[0], element.from[1] - 13, element.from[2] - 2.625],
                    to: [element.to[0], element.to[1] - 13, element.to[2] - 2.625]
                ]
            }
            models["models/block/shelving_media/${name}.json".toString()] = [textures: textures, elements: elements]
        }
    }
    models
}
def phase5Families = {
    Map families = new JsonSlurper().parse(new File(phase5Definitions, 'phase5-families.json')) as Map
    families.shelving_unit.models = shelvingUnitTemplates().keySet().collectEntries { String suffix ->
        [(suffix): [parent: "ironagefurniture:block/template_shelving_unit_${suffix}".toString(), textures: [:]]]
    }
    families.bedside_cabinet.models = bedsideCabinetTemplates().keySet().collectEntries { String suffix ->
        [(suffix): [parent: "ironagefurniture:block/template_bedside_cabinet_wood_ironage_${suffix}".toString(), textures: [:]]]
    }
    families.storage_bench.itemDisplay = families.drawer_unit.itemDisplay
    families.storage_bench.models = storageBenchTemplates(families.storage_bench.itemDisplay).keySet().collectEntries { String model ->
        Map textures = model.startsWith('padded') ? [upholstery: 'minecraft:blocks/wool_colored_red'] : [:]
        [(model): [parent: "ironagefurniture:block/template_storage_bench_${model}".toString(), textures: textures]]
    }
    families.tool_rack.models = toolRackTemplates().keySet().collectEntries { String part ->
        [(part): [parent: "ironagefurniture:block/template_tool_rack_${part}".toString(), textures: [:]]]
    }
    families.half_drawer_unit.itemDisplay = families.drawer_unit.itemDisplay
    [drawer_unit: 16, half_drawer_unit: 8].each { String family, int depth ->
        families[family].models = drawerTemplates(depth).keySet().collectEntries { String suffix ->
            [(suffix): [parent: "ironagefurniture:block/template_${family}_${suffix}".toString(), textures: [:]]]
        }
    }
    families.crate.models = crateTemplates().keySet().collectEntries { String suffix ->
        [(suffix): [parent: "ironagefurniture:block/template_crate_wood_ironage_${suffix}".toString(), textures: [:]]]
    }
    families
}
def phase5StateTemplate = { String family, Map definition, String id, Map families ->
    if (family == 'drawer_unit' || family == 'half_drawer_unit') return drawerBlockstate(id)
    if (family == 'storage_bench') return storageBenchBlockstate(id)
    if (family == 'tool_rack') return toolRackBlockstate(id)
    String template = definition.blockstateTemplate ?: family
    new File(phase5Definitions, "${template}.blockstate.json").getText('UTF-8')
        .replace("${families[template].prefix}oak", id)
}
def phase5Woods = { (phase5Catalog().woods as Map).values().flatten() as List<String> }
def phase5ItemModel = { Map definition, String id ->
    Map model = [parent: "ironagefurniture:block/${id}_${definition.inventory}"]
    if (definition.itemDisplay) model.display = definition.itemDisplay
    model
}

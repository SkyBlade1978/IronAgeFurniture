def produceTrayModel = {
    List elements = []
    (0..3).each { int i ->
        double x = 1.75 + 3.15 * i
        elements.add(woodBoard([x,0,1.75], [x + 3.025,1,14.25], 'planks'))
    }
    [1,14.25].each { x ->
        [1,14.25].each { z ->
            elements.add(woodBoard([x,0,z], [x + 0.75,8,z + 0.75], 'log'))
        }
        elements.add(woodBoard([x,0,1.75], [x + 0.75,2.5,14.25], 'planks'))
        elements.add(woodBoard([x,4.5,1.75], [x + 0.75,6,14.25], 'planks'))
    }
    elements.add(woodBoard([1.75,0,1], [14.25,2.5,1.75], 'planks'))
    elements.add(woodBoard([1.75,3.375,1], [14.25,4.625,1.75], 'planks'))
    elements.add(woodBoard([1.75,0,14.25], [14.25,2.5,15], 'planks'))
    elements.add(woodBoard([1.75,4.5,14.25], [14.25,6.75,15], 'planks'))
    [elements: elements]
}

def produceRackModel = { int joins ->
    List elements = []
    Closure board = { List from, List to, String texture, List hidden = [] ->
        // Keep each tall section on its own 16-pixel UV range.
        (0..1).each { int part ->
            int base = 16 * part
            def bottom = from[1] > base ? from[1] : base
            def top = to[1] < base + 16 ? to[1] : base + 16
            if (top <= bottom) return
            List seams = hidden + (bottom > from[1] ? ['down'] : []) + (top < to[1] ? ['up'] : [])
            Map element = woodBoard([from[0],bottom - base,from[2]], [to[0],top - base,to[2]], texture, seams)
            element.from[1] += base
            element.to[1] += base
            elements.add(element)
        }
    }
    def left = (joins & 1) != 0 ? 0 : 0.25
    def right = (joins & 2) != 0 ? 16 : 15.75
    List seam = (left == 0 ? ['west'] : []) + (right == 16 ? ['east'] : [])
    // Leave the tray's full width between the posts, even when pitched.
    [0.125,15.125].each { x ->
        board([x,0,14.75], [x + 0.75,31,15.75], 'log')
        board([x,0,0.25], [x + 0.75,23,1.0], 'log')
    }
    [1.25,11.75,23.4375].each { y ->
        board([left,y - 1,1], [right,y,2.5], 'planks', seam)
    }
    [3.5,14,23.4375].each { y ->
        board([left,y - 1,14.0], [right,y,14.75], 'planks', seam)
    }
    board([left,29.5,15.125], [right,30.75,15.625], 'planks', seam)
    [elements: elements]
}


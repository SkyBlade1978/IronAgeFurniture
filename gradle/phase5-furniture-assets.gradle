tasks.register('updatePhaseFiveFurnitureAssets') {
    group = 'generation'
    description = 'Regenerates Phase 5 models, states and names from the same wood catalog and textures as chairs.'
    doLast {
        Map families = phase5Families()
        phase5Write(phase5Manifest, phase5Models())
        phase5Woods().each { String wood ->
            families.each { family, definition ->
                String id = "${definition.prefix}${wood}"
                new File(phase5Root, "blockstates/${id}.json").setText(
                        phase5StateTemplate(family, definition, id, families), 'UTF-8')
                phase5Write(new File(phase5Root, "models/item/${id}.json"),
                        phase5ItemModel(definition as Map, id))
            }
        }
        fileTree(new File(phase5Root, 'lang')).matching { include '*.lang' }.files.each { File locale ->
            String text = locale.getText('UTF-8').replace('\r\n', '\n')
            Map<String, String> names = [:]
            text.readLines().findAll { it.contains('=') }.each { String line ->
                int equals = line.indexOf('='); names[line.substring(0, equals)] = line.substring(equals + 1)
            }
            String oak = phase5WoodName(names['tile.ironagefurniture.chair_wood_ironage_classic_oak.name'])
            String dining = names['tile.ironagefurniture.table_dining_oak.name']
            String cabinet = names['tile.ironagefurniture.cabinet_wood_ironage_oak.name']
            Map extraTitles = ['half_cabinet', 'barrel', 'side_barrel', 'bottle_rack'].collectEntries { family ->
                String title = names["tile.ironagefurniture.${families[family].prefix}oak.name"]
                if (!title || !title.contains(oak)) throw new GradleException("Missing ${family} oak title in ${locale.name}")
                [(family): title]
            }
            if (!dining.contains(oak) || !cabinet.contains(oak)) throw new GradleException("Missing wood title in ${locale.name}")
            List<String> titles = phase5Titles[locale.name - '.lang'] ?:
                    ['%s Low Table', '%s Wall Shelf', '%s Dining Chair', '%s Shelving Unit']
            List<String> bedside = bedsideTitles[locale.name - '.lang'] ?:
                    ['%s Bedside Cabinet', 'Upper Drawer', 'Lower Drawer']
            List<String> crate = crateTitles[locale.name - '.lang'] ?: ['%s Shipping Crate', 'Shipping Crate', 'Packed']
            List<String> drawer = drawerTitles[locale.name - '.lang'] ?: ['%s Drawer Unit', '%s Half-depth Drawer Unit']
            List<String> bench = storageBenchTitles[locale.name - '.lang'] ?:
                    ['%s Storage Bench', '%1$s with %2$s Cushion', 'Red', 'Storage Bench']
            Map storageNames = ['container.ironagefurniture.upper_drawer': bedside[1],
                    'item.ironagefurniture.padded_storage_bench': bench[1],
                    'item.ironagefurniture.upholstery.red': bench[2],
                    'container.ironagefurniture.storage_bench': bench[3],
                    'container.ironagefurniture.double_storage_bench': doubleStorageBenchTitles[locale.name - '.lang'] ?: 'Double Storage Bench',
                    'container.ironagefurniture.lower_drawer': bedside[2],
                    'container.ironagefurniture.crate': crate[1],
                    'item.ironagefurniture.crate.packed': crate[2]]
            List<String> market = produceTitles[locale.name - '.lang'] ?: ['Produce Tray', 'Market Rack', 'Contents unavailable']
            storageNames['item.ironagefurniture.produce_tray.unavailable'] = market[2]
            storageNames['tile.ironagefurniture.produce_tray.name'] = market[0]
            storageNames['tile.ironagefurniture.produce_rack.name'] = market[1]
            List<String> retained = text.readLines().findAll { String line ->
                !families.values().any { line.startsWith("tile.ironagefurniture.${it.prefix}") } &&
                        !line.startsWith('tile.ironagefurniture.produce_tray.') &&
                        !line.startsWith('tile.ironagefurniture.produce_rack.') &&
                        !storageNames.keySet().any { line.startsWith(it + '=') }
            }
            while (retained && retained.last().isEmpty()) retained.remove(retained.size() - 1)
            retained.add('')
            storageNames.each { key, name -> retained.add("${key}=${name}".toString()) }
            retained.add('')
            phase5Woods().sort().each { String wood ->
                String woodName = phase5WoodName(names["tile.ironagefurniture.chair_wood_ironage_classic_${wood}.name"])
                Map familyNames = [dining: dining.replace(oak, woodName), cabinet: cabinet.replace(oak, woodName),
                        low: titles[0].replace('%s', woodName), shelf: titles[1].replace('%s', woodName),
                        dining_chair: titles[2].replace('%s', woodName), shelving_unit: titles[3].replace('%s', woodName),
                        bedside_cabinet: bedside[0].replace('%s', woodName), crate: crate[0].replace('%s', woodName),
                        drawer_unit: drawer[0].replace('%s', woodName), half_drawer_unit: drawer[1].replace('%s', woodName),
                        storage_bench: bench[0].replace('%s', woodName),
                        tool_rack: (toolRackTitles[locale.name - '.lang'] ?: '%s Tool Rack').replace('%s', woodName)]
                extraTitles.each { family, title -> familyNames[family] = title.replace(oak, woodName) }
                families.each { family, definition ->
                    retained.add("tile.ironagefurniture.${definition.prefix}${wood}.name=${familyNames[family]}")
                }
                retained.add("tile.ironagefurniture.produce_tray.${wood}.name=${market[0]} (${woodName})".toString())
                retained.add("tile.ironagefurniture.produce_rack.${wood}.name=${market[1]} (${woodName})".toString())
            }
            locale.setText(retained.join('\n') + '\n', 'UTF-8')
        }
        logger.lifecycle("Generated ${families.size()} furniture families for ${phase5Woods().size()} chair woods.")
    }
}

tasks.register('verifyPhaseFiveFurnitureAssets') {
    group = 'verification'
    inputs.file phase5Manifest
    inputs.file 'gradle/furniture-catalog.json'
    inputs.dir phase5Definitions
    inputs.file new File(phase5Root, 'models/block/template_barrel_wood_ironage.json')
    doLast {
        Map expectedModels = phase5Models()
        if (!phase5Manifest.isFile() || new JsonSlurper().parse(phase5Manifest) != expectedModels) {
            throw new GradleException('Phase 5 wood models are stale; run updatePhaseFiveFurnitureAssets')
        }
        List trayParts = expectedModels.generatedModels['models/block/template_produce_tray.json'].elements
        (0..3).each { int joins ->
            List frame = expectedModels.generatedModels["models/block/template_produce_rack_${joins}.json".toString()].elements
            frame.each { rackPart ->
                boolean upright = rackPart.faces.north.texture == '#log'
                trayParts.each { trayPart ->
                    if (upright && rackPart.to[0] >= trayPart.from[0] && trayPart.to[0] >= rackPart.from[0]) {
                        throw new GradleException("Market rack posts must clear the tray width (join mask ${joins})")
                    }
                    // The flat top tray is seated at 23.5 model pixels above the base.
                    if ((0..2).every { int axis ->
                        def lift = axis == 1 ? 23.5 : 0
                        rackPart.to[axis] >= trayPart.from[axis] + lift && trayPart.to[axis] + lift >= rackPart.from[axis]
                    }) {
                        throw new GradleException("Market rack frame overlaps the flat top tray (join mask ${joins})")
                    }
                }
            }
        }
        Map families = phase5Families()
        Set prefixes = families.values().collect { it.prefix } as Set
        if (prefixes != phase5Catalog().phaseFive.woodPrefixes as Set) {
            throw new GradleException('Phase 5 asset families and wood catalog differ')
        }
        phase5Woods().each { String wood ->
            families.each { family, definition ->
                String id = "${definition.prefix}${wood}"
                Map actual = new JsonSlurper().parse(new File(phase5Root, "blockstates/${id}.json")) as Map
                Map expected = new JsonSlurper().parseText(phase5StateTemplate(family, definition, id, families)) as Map
                if (actual != expected) throw new GradleException("Stale Phase 5 blockstate: ${id}")
                Map itemModel = new JsonSlurper().parse(new File(phase5Root, "models/item/${id}.json")) as Map
                if (itemModel != phase5ItemModel(definition as Map, id))
                    throw new GradleException("Stale Phase 5 inventory model: ${id}")
            }
        }
        ['inner_corner', 'outer_corner'].each { String shape ->
            List rails = shape == 'inner_corner' ? [[[8,9,0],[10,10,8]], [[10,9,6],[16,10,8]]]
                    : [[[0,9,6],[10,10,8]], [[8,9,8],[10,10,16]]]
            fileTree(new File(phase5Root, 'models/block')).matching {
                include "template_shelf_wall_${shape}*.json"
            }.files.each { File model ->
                List elements = new JsonSlurper().parse(model).elements
                rails.each { List rail ->
                    if (!elements.any { it.from == rail[0] && it.to == rail[1] && it.faces.north.texture == '#log' })
                        throw new GradleException("Missing exposed underside rail in ${model.name}")
                }
            }
        }
        fileTree(new File(phase5Root, 'lang')).matching { include '*.lang' }.files.each { File locale ->
            String text = locale.getText('UTF-8')
            phase5Woods().each { String wood ->
                ['produce_tray', 'produce_rack'].each { String id ->
                    if (!text.contains("tile.ironagefurniture.${id}.${wood}.name="))
                        throw new GradleException("Missing ${id} name for ${wood} in ${locale.name}")
                }
            }
            ['chairs','benches','beds','lights','tables','storage','decorations'].each { String tab ->
                if (!text.contains("itemGroup.ironagefurniture.${tab}="))
                    throw new GradleException("Missing creative category ${tab} in ${locale.name}")
            }
            ['white','orange','magenta','light_blue','yellow','lime','pink','gray','silver','cyan','purple','blue','brown','green','red','black'].each { String colour ->
                if (!text.contains("tile.ironagefurniture.ornament_glass_vase.${colour}.name="))
                    throw new GradleException("Missing glass vase ${colour} in ${locale.name}")
            }
        }
        fileTree(new File(phase5Root, 'models/block')).matching {
            include 'template_bottle_rack_wood_ironage_*.json'
        }.files.each { File model ->
            List elements = new JsonSlurper().parse(model).elements
            ['west':[0,0,1,2], 'east':[0,1,1,2], 'down':[1,0,0,2],
             'up':[1,1,0,2], 'north':[2,0,0,1], 'south':[2,1,0,1]].each { face, axes ->
                elements.eachWithIndex { a, int i ->
                    if (!a.faces.containsKey(face)) return
                    elements.drop(i + 1).each { b ->
                        if (!b.faces.containsKey(face)) return
                        int normal = axes[0], horizontal = axes[2], vertical = axes[3]
                        def planeA = axes[1] ? a.to[normal] : a.from[normal]
                        def planeB = axes[1] ? b.to[normal] : b.from[normal]
                        if (Math.abs((planeA as double) - (planeB as double)) < 0.000001D
                                && Math.min(a.to[horizontal] as double, b.to[horizontal] as double) - Math.max(a.from[horizontal] as double, b.from[horizontal] as double) > 0.000001D
                                && Math.min(a.to[vertical] as double, b.to[vertical] as double) - Math.max(a.from[vertical] as double, b.from[vertical] as double) > 0.000001D)
                            throw new GradleException("Overlapping bottle-rack ${face} faces in ${model.name}: ${a.from}/${a.to}, ${b.from}/${b.to}")
                    }
                }
            }
        }
        fileTree(new File(phase5Root, 'models/block')).matching {
            include 'template_*cabinet_wood_ironage_*.json'
        }.files.each { File file ->
            new JsonSlurper().parse(file).elements.each { element ->
                element.faces.each { face, data ->
                    if (data.texture != '#log') return
                    List axes = ['north':[0,1], 'south':[0,1], 'east':[2,1], 'west':[2,1], 'up':[0,2], 'down':[0,2]][face]
                    List lengths = axes.collect { element.to[it] - element.from[it] }
                    if ((data.rotation ?: 0) % 180 == 90) lengths = lengths.reverse()
                    if (Math.abs(data.uv[2] - data.uv[0] - lengths[0]) > 0.0001
                            || Math.abs(data.uv[3] - data.uv[1] - lengths[1]) > 0.0001)
                        throw new GradleException("Stretched cabinet bark UV in ${file.name}: ${face}")
                }
            }
        }
    }
}

tasks.named('check') { dependsOn tasks.named('verifyPhaseFiveFurnitureAssets') }

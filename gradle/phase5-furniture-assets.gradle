def drawerTemplates = { int depth ->
    Map<String, List> parts = [
        body: [
            woodBoard([0,0,0], [16,16,1], 'planks')
        ],
        left_side: [woodBoard([0,0,1], [1,16,depth], 'planks', ['north'])],
        right_side: [woodBoard([15,0,1], [16,16,depth], 'planks', ['north'])]
    ]

    ['single', 'left', 'right'].each { String pair ->
        // The models face south, so positive X is the viewer's right.
        int left = pair == 'right' ? 0 : 1
        int right = pair == 'left' ? 16 : 15
        List<String> seams = ['north', 'east', 'west']
        parts["${pair}_top".toString()] = [woodBoard([left,15,1], [right,16,depth], 'planks', seams)]
        parts["${pair}_bottom".toString()] = [woodBoard([left,0,1], [right,1,depth], 'planks', seams)]
        // Recess the dividers between drawer fronts by the same amount in single and stacked units.
        def dividerFront = depth - 2
        parts["${pair}_joined_top".toString()] = [woodBoard([left,15.5,1], [right,16,dividerFront], 'planks', seams + 'up')]
        parts["${pair}_joined_bottom".toString()] = [woodBoard([left,0,1], [right,0.5,dividerFront], 'planks', seams + 'down')]
        parts["${pair}_middle".toString()] = [woodBoard([left,7.5,1], [right,8.5,dividerFront], 'planks', seams)]

        List lower = [1.125,6.875]
        Map levels = [lower: lower, upper: lower.collect { it + 8 }]
        levels.each { String level, List height ->
            def handleBottom = (height[0] + height[1] - 1) / 2
            [false, true].each { boolean open ->
                def start = open ? depth - 2.5 : depth - 4.5
                def front = depth - 0.5 + (open ? 2 : 0)
                def x0 = pair == 'right' ? 0 : 1.125
                def x1 = pair == 'left' ? 16 : 14.875
                def handleStart = pair == 'right' ? 0 : pair == 'left' ? 14 : 6
                def handleEnd = pair == 'right' ? 2 : pair == 'left' ? 16 : 10
                List<String> internal = pair == 'left' ? ['east'] : pair == 'right' ? ['west'] : []
                List boards = [
                    woodBoard([x0,height[0],start], [x1,height[0] + 0.5,front - 0.5], 'planks', internal + 'south'),
                    woodBoard([x0,height[0] + 0.5,start], [x1,height[1],start + 0.5], 'planks', internal + 'down'),
                    woodBoard([x0,height[0],front - 0.5], [x1,height[1],front], 'planks', internal),
                    woodBoard([handleStart,handleBottom,front], [handleEnd,handleBottom + 1,front + 0.5], 'log',
                        internal + 'north')
                ]
                if (pair != 'right') {
                    boards.add(woodBoard([x0,height[0] + 0.5,start + 0.5], [x0 + 0.5,height[1],front - 0.5],
                        'planks', ['north','south','down']))
                }
                if (pair != 'left') {
                    boards.add(woodBoard([x1 - 0.5,height[0] + 0.5,start + 0.5], [x1,height[1],front - 0.5],
                        'planks', ['north','south','down']))
                }
                parts["${pair}_${level}_${open ? 'open' : 'closed'}".toString()] = boards
            }
        }
    }
    List inventory = ['body','left_side','right_side','single_top','single_bottom','single_middle','single_lower_closed','single_upper_closed']
    parts.inventory = inventory.collectMany { parts[it] }
    parts.collectEntries { name, elements -> [(name.toString()): [elements: elements]] }
}

def drawerBlockstate = { String id ->
    List<Map> selectors = []
    [south: 0, west: 90, north: 180, east: 270].each { String facing, int rotation ->
        Closure add = { Map condition, String part ->
            Map apply = [model: "ironagefurniture:${id}_${part}"]
            if (rotation) apply.y = rotation
            selectors.add([when: [facing: facing] + condition, apply: apply])
        }
        add([:], 'body')
        add([pair: 'single|left'], 'left_side')
        add([pair: 'single|right'], 'right_side')

        ['single', 'left', 'right'].each { String pair ->
            add([pair: pair], "${pair}_middle")
            [false, true].each { boolean set ->
                add([pair: pair, above: set.toString()], "${pair}_${set ? 'joined_' : ''}top")
                add([pair: pair, below: set.toString()], "${pair}_${set ? 'joined_' : ''}bottom")
                add([pair: pair, lower_open: set.toString()], "${pair}_lower_${set ? 'open' : 'closed'}")
                add([pair: pair, upper_open: set.toString()], "${pair}_upper_${set ? 'open' : 'closed'}")
            }
        }
    }
    JsonOutput.toJson([multipart: selectors]) + '\n'
}

def storageBenchTemplates = { Map display ->
    Map models = [:]
    ['single', 'left', 'right'].each { String type ->
        // The front faces south. Each half spans to the seam and keeps the feet at its exposed end.
        boolean joinsWest = type == 'right'
        boolean joinsEast = type == 'left'
        int bodyLeft = joinsWest ? 0 : 2
        int bodyRight = joinsEast ? 16 : 14
        List<String> seam = joinsWest ? ['west'] : joinsEast ? ['east'] : []
        List frame = [
            woodBoard([bodyLeft,1.5,2], [bodyRight,2,14], 'log', seam),
            woodBoard([bodyLeft,2,2], [bodyRight,7,14.25], 'planks', seam + ['up','down']),
            woodBoard([3,2.25,14.25], [13,6.75,14.625], 'planks', ['north']),
            woodBoard([6.375,4,14.625], [9.625,5,15], 'log', ['north']),
            woodBoard([joinsWest ? 0 : 1,7,1], [joinsEast ? 16 : 15,8,15], 'planks', seam)
        ]

        List<Integer> feet = joinsWest ? [12] : joinsEast ? [2] : [2,12]
        feet.each { x ->
            [2,12].each { z -> frame.add(woodBoard([x,0,z], [x + 2,1.5,z + 2], 'log', ['up'])) }
        }

        String suffix = type == 'single' ? '' : "_${type}"
        models["plain${suffix}".toString()] = [credit: 'By FoxNekitsune', elements: frame]
        Map padded = [credit: 'By FoxNekitsune', elements: frame +
            woodBoard([joinsWest ? 0 : 1.5,8,1.5], [joinsEast ? 16 : 14.5,9,14.5], 'upholstery', seam + 'down')]
        if (type == 'single') padded.display = display
        models["padded${suffix}".toString()] = padded
    }
    models
}

def storageBenchBlockstate = { String id ->
    Map variants = [:]
    [south: 0, west: 90, north: 180, east: 270].each { String facing, int rotation ->
        ['single', 'left', 'right'].each { String type ->
            String suffix = type == 'single' ? '' : "_${type}"
            variants["facing=${facing},padded=false,type=${type}"] = [model: "ironagefurniture:${id}_plain${suffix}", y: rotation]
            variants["facing=${facing},padded=true,type=${type}"] = [model: "ironagefurniture:padded/${id}_padded${suffix}", y: rotation]
        }
    }
    JsonOutput.prettyPrint(JsonOutput.toJson([variants: variants])) + '\n'
}

def toolRackTemplates = {
    (0..3).collectEntries { int connections ->
        int left = (connections & 1) == 0 ? 1 : 0
        int right = (connections & 2) == 0 ? 15 : 16
        List<String> seams = []
        if (left == 0) seams.add('west')
        if (right == 16) seams.add('east')

        List elements = [
            woodBoard([left,11,14.5], [right,13,16], 'planks', seams),
            woodBoard([left,11,14.25], [right,11.375,14.5], 'log', seams + 'south'),
            woodBoard([left,12.625,14.25], [right,13,14.5], 'log', seams + 'south')
        ]
        if (left != 0) {
            elements.add(woodBoard([left,11.375,14.125], [left + 0.75,12.625,14.5], 'log', ['south']))
        }
        if (right != 16) {
            elements.add(woodBoard([right - 0.75,11.375,14.125], [right,12.625,14.5], 'log', ['south']))
        }

        [4.5,11.5].each { x ->
            elements.add(woodBoard([x - 0.4375,11.75,12.5], [x + 0.4375,12.375,14.5], 'log', ['south']))
            elements.add(woodBoard([x - 0.4375,12.375,12.5], [x + 0.4375,12.875,13.125], 'log', ['down']))
        }
        [(connections.toString()): [credit: 'By FoxNekitsune', elements: elements]]
    }
}

